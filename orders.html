<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ARTistico Admin — Orders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', Arial, sans-serif; background: #f7f5ef; padding: 30px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }

        .login-screen { align-items: center; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08); max-width: 420px; padding: 40px 32px; width: 100%; }
        .login-logo { align-items: center; display: flex; font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 800; gap: 10px; justify-content: center; margin-bottom: 24px; }
        .login-logo-mark { align-items: center; background: #294d3b; border-radius: 50%; color: white; display: inline-flex; font-size: 17px; height: 34px; justify-content: center; width: 34px; }
        .login-logo-accent { color: #d87550; }
        .login-title { font-family: 'Playfair Display', serif; font-size: 26px; margin-bottom: 8px; text-align: center; }
        .login-subtitle { color: #718078; font-size: 13px; margin-bottom: 28px; text-align: center; }
        .login-label { color: #17231f; display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; margin-top: 16px; }
        .login-input { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; padding: 12px 14px; width: 100%; }
        .login-input:focus { border-color: #294d3b; box-shadow: 0 0 0 3px rgba(41, 77, 59, 0.1); outline: none; }
        .login-btn { background: #294d3b; border: 0; border-radius: 8px; color: white; cursor: pointer; font-size: 14px; font-weight: 700; margin-top: 24px; padding: 14px; width: 100%; }
        .login-btn:hover { background: #17231f; }
        .login-btn:disabled { background: #ccc; cursor: not-allowed; }
        .login-error { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; color: #dc2626; display: none; font-size: 13px; margin-top: 16px; padding: 10px 14px; text-align: center; }

        .dashboard { display: none; }
        .dashboard.active { display: block; }
        h1 { font-family: 'Playfair Display', serif; font-size: 32px; color: #294d3b; }
        .subtitle { color: #718078; margin-bottom: 20px; }
        .header-row { align-items: center; display: flex; justify-content: space-between; margin-bottom: 20px; gap: 20px; flex-wrap: wrap; }
        .user-info { align-items: center; display: flex; gap: 12px; }
        .user-email { color: #718078; font-size: 13px; }
        .logout-btn { background: transparent; border: 1px solid #ddd; border-radius: 20px; color: #718078; cursor: pointer; font-size: 12px; font-weight: 600; padding: 6px 14px; }
        .logout-btn:hover { background: #fee; border-color: #f88; color: #c00; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 18px 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .stat-card span { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card strong { font-size: 24px; display: block; margin-top: 4px; }

        .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .filters button { padding: 8px 18px; border: 1px solid #ddd; background: white; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.3s; }
        .filters button.active { background: #294d3b; color: white; border-color: #294d3b; }
        .filters button:hover { transform: translateY(-2px); }

        .table-wrapper { background: white; border-radius: 12px; overflow-x: auto; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1200px; }
        th { background: #294d3b; color: white; padding: 14px 12px; text-align: left; font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
        td { padding: 14px 12px; border-bottom: 1px solid #f0ece6; vertical-align: top; }

        .status { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: inline-block; letter-spacing: 0.3px; }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-pending_verification { background: #cce5ff; color: #004085; }
        .status-paid { background: #d4edda; color: #155724; }
        .status-verified { background: #d4edda; color: #155724; }
        .status-shipped { background: #d1ecf1; color: #0c5460; }
        .status-delivered { background: #d4edda; color: #155724; }
        .status-failed { background: #f8d7da; color: #721c24; }
        .status-cancelled_refund_pending { background: #fff3cd; color: #856404; }
        .status-cancelled_refunded { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }

        .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; margin: 2px; transition: 0.3s; letter-spacing: 0.3px; }
        .btn-success { background: #27ae60; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-info { background: #3498db; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-refund { background: #9b59b6; color: white; }
        .btn:hover { transform: scale(1.05); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .empty { text-align: center; padding: 50px; color: #999; }
        .back-btn { display: inline-block; margin-top: 20px; background: #294d3b; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; }
        .loading { text-align: center; padding: 50px; color: #294d3b; font-size: 18px; }

        .amounts { font-size: 12px; line-height: 1.7; }
        .amounts strong { color: #294d3b; }
        .amounts .advance { color: #27ae60; font-weight: 700; }
        .amounts .cod { color: #d87550; font-weight: 700; }

        .item-list { font-size: 11px; line-height: 1.6; color: #555; }
        .item-list strong { color: #17231f; }

        .contact-info { font-size: 12px; line-height: 1.6; }
        .contact-info a { color: #3498db; text-decoration: none; }
        .contact-info a:hover { text-decoration: underline; }

        @media (max-width: 768px) { body { padding: 16px; } h1 { font-size: 24px; } .stats { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <div class="login-box">
        <div class="login-logo">
            <span class="login-logo-mark">A</span>
            <span>ART<span class="login-logo-accent">istico</span></span>
        </div>
        <h1 class="login-title">Admin Login</h1>
        <p class="login-subtitle">শুধুমাত্র অ্যাডমিন অ্যাক্সেসের জন্য</p>
        <form id="loginForm">
            <label class="login-label" for="emailInput">Email</label>
            <input id="emailInput" class="login-input" type="email" required placeholder="your@email.com" autocomplete="email">
            <label class="login-label" for="passwordInput">Password</label>
            <input id="passwordInput" class="login-input" type="password" required placeholder="••••••••" autocomplete="current-password">
            <button type="submit" id="loginBtn" class="login-btn">Login</button>
        </form>
        <div id="loginError" class="login-error"></div>
    </div>
</div>

<div id="dashboard" class="dashboard">
    <div class="container">
        <div class="header-row">
            <div>
                <h1>📦 Order Management</h1>
                <p class="subtitle">ARTistico Wear — Track, verify, and manage orders</p>
            </div>
            <div class="user-info">
                <span id="userEmail" class="user-email"></span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>

        <div class="stats" id="stats"></div>

        <div class="filters">
            <button class="active" data-filter="all">All</button>
            <button data-filter="pending">⏳ Pending Verify</button>
            <button data-filter="verified">✅ Verified</button>
            <button data-filter="shipped">🚚 Shipped</button>
            <button data-filter="delivered">📦 Delivered</button>
            <button data-filter="cancelled">❌ Cancelled</button>
            <button data-filter="refund">💰 Refund Pending</button>
        </div>

        <div class="table-wrapper">
            <div id="ordersTable"><div class="loading">⏳ Firebase থেকে অর্ডার লোড হচ্ছে...</div></div>
        </div>

        <a href="index.html" class="back-btn">← Back to Shop</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAOSjDnj0B3ohYch3qtUN6DJLKCUzILSJ0",
        authDomain: "artistico-c3a5e.firebaseapp.com",
        databaseURL: "https://artistico-c3a5e-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "artistico-c3a5e",
        storageBucket: "artistico-c3a5e.firebasestorage.app",
        messagingSenderId: "413843983195",
        appId: "1:413843983195:web:a38d4e7407bb310f62e87e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const FIREBASE_URL = "https://artistico-c3a5e-default-rtdb.asia-southeast1.firebasedatabase.app";

    const loginScreen = document.getElementById("loginScreen");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const userEmail = document.getElementById("userEmail");
    const logoutBtn = document.getElementById("logoutBtn");

    let allOrders = [];

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginError.style.display = "none";
        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";
        try {
            await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        } catch (err) {
            let msg = "লগইন ব্যর্থ হয়েছে।";
            if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") msg = "ইমেইল বা পাসওয়ার্ড ভুল।";
            else if (err.code === "auth/too-many-requests") msg = "অনেকবার ভুল হয়েছে। পরে চেষ্টা করুন।";
            loginError.textContent = msg;
            loginError.style.display = "block";
        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = "Login";
        }
    });

    onAuthStateChanged(auth, async (user) => {
        if (user && user.email === "info.artisticowear@gmail.com") {
            loginScreen.style.display = "none";
            dashboard.classList.add("active");
            userEmail.textContent = user.email;
            passwordInput.value = "";
            await loadOrders("all");
        } else if (user) {
            await signOut(auth);
            loginError.textContent = "আপনি অনুমোদিত অ্যাডমিন নন।";
            loginError.style.display = "block";
        } else {
            loginScreen.style.display = "flex";
            dashboard.classList.remove("active");
        }
    });

    logoutBtn.addEventListener("click", async () => {
        if (confirm("লগআউট করতে চান?")) await signOut(auth);
    });

    async function loadOrders(filter = 'all') {
        const container = document.getElementById('ordersTable');
        try {
            container.innerHTML = '<div class="loading">⏳ Firebase থেকে অর্ডার লোড হচ্ছে...</div>';
            const user = auth.currentUser;
            if (!user) throw new Error("Not logged in");
            const token = await user.getIdToken();
            const res = await fetch(`${FIREBASE_URL}/Orders.json?auth=${token}`);
            const data = await res.json();
            if (!data) {
                container.innerHTML = '<div class="empty">📭 এখনো কোনো অর্ডার নেই।</div>';
                document.getElementById('stats').innerHTML = '';
                return;
            }
            allOrders = Object.keys(data).map(key => ({ firebaseKey: key, ...data[key] }));
            allOrders.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            renderStats();
            renderTable(filter);
        } catch (err) {
            console.error("Firebase error:", err);
            container.innerHTML = '<div class="empty">❌ অর্ডার লোড করা যায়নি। Firebase Rules চেক করুন।</div>';
        }
    }

    function renderStats() {
        const stats = document.getElementById('stats');
        const total = allOrders.length;
        const pending = allOrders.filter(o => o.status === 'pending' || o.status === 'pending_verification').length;
        const verified = allOrders.filter(o => o.status === 'verified' || o.status === 'paid').length;
        const shipped = allOrders.filter(o => o.status === 'shipped').length;
        const cancelled = allOrders.filter(o => o.status && o.status.startsWith('cancelled')).length;
        const totalCOD = allOrders.filter(o => o.status !== 'cancelled' && o.status !== 'cancelled_refunded').reduce((s, o) => s + (Number(o.codAmount) || 0), 0);

        stats.innerHTML = `
            <div class="stat-card"><span>Total Orders</span><strong>${total}</strong></div>
            <div class="stat-card"><span>Pending Verify</span><strong style="color:#f39c12;">${pending}</strong></div>
            <div class="stat-card"><span>Verified</span><strong style="color:#27ae60;">${verified}</strong></div>
            <div class="stat-card"><span>Shipped</span><strong style="color:#3498db;">${shipped}</strong></div>
            <div class="stat-card"><span>Cancelled</span><strong style="color:#e74c3c;">${cancelled}</strong></div>
            <div class="stat-card"><span>COD Total</span><strong>৳${totalCOD}</strong></div>
        `;
    }

    function renderTable(filter = 'all') {
        const container = document.getElementById('ordersTable');
        let filtered = allOrders;

        if (filter === 'pending') filtered = allOrders.filter(o => o.status === 'pending' || o.status === 'pending_verification');
        else if (filter === 'verified') filtered = allOrders.filter(o => o.status === 'verified' || o.status === 'paid');
        else if (filter === 'shipped') filtered = allOrders.filter(o => o.status === 'shipped');
        else if (filter === 'delivered') filtered = allOrders.filter(o => o.status === 'delivered');
        else if (filter === 'cancelled') filtered = allOrders.filter(o => o.status && o.status.startsWith('cancelled'));
        else if (filter === 'refund') filtered = allOrders.filter(o => o.status === 'cancelled_refund_pending');

        if (!filtered.length) {
            container.innerHTML = '<div class="empty">📭 No orders found.</div>';
            return;
        }

        let html = `<table>
            <tr>
                <th>Order ID / Date</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Payment</th>
                <th>Amounts</th>
                <th>Status</th>
                <th>Action</th>
            </tr>`;

        filtered.forEach((order) => {
            const key = order.firebaseKey;
            const statusClass = `status-${order.status || 'pending'}`;
            const itemsSummary = (order.items || []).map(i => `<strong>${i.name}</strong> (${i.size}) x${i.quantity}`).join('<br>');
            const date = order.createdAt ? new Date(order.createdAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';

            html += `<tr>
                <td>
                    <strong style="color:#294d3b;">${order.orderNumber || 'N/A'}</strong><br>
                    <small style="color:#888;">${date}</small>
                </td>
                <td>
                    <div class="contact-info">
                        <strong>${order.customer?.name || 'N/A'}</strong><br>
                        📞 <a href="tel:${order.customer?.phone}">${order.customer?.phone || 'N/A'}</a><br>
                        ✉️ <a href="mailto:${order.customer?.email}">${order.customer?.email || 'N/A'}</a><br>
                        📍 ${order.customer?.address || 'N/A'}<br>
                        <small>${order.delivery?.area || ''}</small>
                    </div>
                </td>
                <td><div class="item-list">${itemsSummary || '-'}</div></td>
                <td>
                    <strong>${order.payment || 'N/A'}</strong><br>
                    <small>Sender: ${order.senderNumber || 'N/A'}</small><br>
                    <small>TrxID: <strong>${order.trxId || 'N/A'}</strong></small>
                </td>
                <td>
                    <div class="amounts">
                        <span class="advance">Advance: ৳${order.advancePaid || order.deliveryCharge || order.delivery?.charge || 0}</span><br>
                        <span class="cod">COD: ৳${order.codAmount || order.subtotal || 0}</span><br>
                        <strong>Total: ৳${order.total || 0}</strong>
                    </div>
                </td>
                <td><span class="status ${statusClass}">${(order.status || 'pending').toUpperCase().replace(/_/g, ' ')}</span></td>
                <td>
                    ${(order.status === 'pending' || order.status === 'pending_verification') ? `
                        <button class="btn btn-success" onclick="updateStatus('${key}', 'verified')">✅ Verify</button>
                        <button class="btn btn-danger" onclick="updateStatus('${key}', 'cancelled')">❌ Cancel</button>
                    ` : ''}
                    ${(order.status === 'verified' || order.status === 'paid') ? `
                        <button class="btn btn-info" onclick="updateStatus('${key}', 'shipped')">🚚 Ship</button>
                    ` : ''}
                    ${order.status === 'shipped' ? `
                        <button class="btn btn-success" onclick="updateStatus('${key}', 'delivered')">📦 Delivered</button>
                    ` : ''}
                    ${order.status === 'cancelled_refund_pending' ? `
                        <button class="btn btn-refund" onclick="markRefunded('${key}')">💰 Refund Done</button>
                    ` : ''}
                    <button class="btn btn-warning" onclick="viewOrder('${key}')">👁 View</button>
                </td>
            </tr>`;
        });

        html += '</table>';
        container.innerHTML = html;
    }

    window.updateStatus = async function(key, status) {
        const labels = {
            verified: 'Verified (Paid)',
            shipped: 'Shipped',
            delivered: 'Delivered',
            cancelled: 'Cancelled (No Refund)'
        };
        if (!confirm(`এই অর্ডারের স্ট্যাটাস "${labels[status] || status}" করতে চান?`)) return;
        try {
            const user = auth.currentUser;
            const token = await user.getIdToken();
            await fetch(`${FIREBASE_URL}/Orders/${key}.json?auth=${token}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status, updatedAt: new Date().toISOString() })
            });
            alert('✅ Status আপডেট হয়েছে!');
            const active = document.querySelector('.filters .active')?.dataset?.filter || 'all';
            loadOrders(active);
        } catch (err) {
            alert('❌ আপডেট করা যায়নি: ' + err.message);
        }
    };

    window.markRefunded = async function(key) {
        const order = allOrders.find(o => o.firebaseKey === key);
        const amount = order?.advancePaid || order?.deliveryCharge || 0;
        if (!confirm(`৳${amount} কাস্টমারকে ফেরত পাঠানো হয়েছে?\n\nএটা নিশ্চিত করুন।`)) return;
        try {
            const user = auth.currentUser;
            const token = await user.getIdToken();
            await fetch(`${FIREBASE_URL}/Orders/${key}.json?auth=${token}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    status: 'cancelled_refunded',
                    refundStatus: 'refunded',
                    refundedAt: new Date().toISOString()
                })
            });
            alert('✅ Refund Done! কাস্টমারকে জানানো হয়েছে।');
            const active = document.querySelector('.filters .active')?.dataset?.filter || 'all';
            loadOrders(active);
        } catch (err) {
            alert('❌ Refund update করা যায়নি: ' + err.message);
        }
    };

    window.viewOrder = function(key) {
        const o = allOrders.find(x => x.firebaseKey === key);
        if (!o) return;
        const itemsText = (o.items || []).map(i => `  • ${i.name} (${i.size}) x${i.quantity} — ৳${i.price}`).join('\n');
        alert(
            `📦 ORDER DETAILS\n\n` +
            `Order: ${o.orderNumber}\n` +
            `Date: ${o.createdAt ? new Date(o.createdAt).toLocaleString('en-GB') : ''}\n\n` +
            `👤 Customer:\n  Name: ${o.customer?.name}\n  Phone: ${o.customer?.phone}\n  Email: ${o.customer?.email}\n  Address: ${o.customer?.address}\n\n` +
            `📦 Items:\n${itemsText}\n\n` +
            `🚚 Delivery: ${o.delivery?.area} (৳${o.delivery?.charge})\n` +
            `💰 Advance Paid: ৳${o.advancePaid || 0}\n` +
            `📊 COD Amount: ৳${o.codAmount || 0}\n` +
            `📈 Total: ৳${o.total}\n\n` +
            `💳 Payment: ${o.payment}\n` +
            `📞 Sender: ${o.senderNumber || 'N/A'}\n` +
            `🔖 TrxID: ${o.trxId || 'N/A'}\n\n` +
            `Status: ${o.status}`
        );
    };

    document.querySelectorAll('.filters button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            renderTable(this.dataset.filter);
        });
    });
</script>
</body>
</html>
