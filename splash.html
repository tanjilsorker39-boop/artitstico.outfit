<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTistico Wear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: #000;
            height: 100vh;
            overflow: hidden;
            font-family: 'DM Sans', sans-serif;
        }

        .splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 50%, #000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ============================================
           BOKEH BACKGROUND — Cinematic Blur
           ============================================ */
        .bokeh {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .bokeh-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 169, 97, 0.4) 0%, transparent 70%);
            filter: blur(40px);
            animation: bokehFloat 12s ease-in-out infinite;
        }

        .bokeh-1 { width: 300px; height: 300px; top: 10%; left: 10%; animation-delay: 0s; }
        .bokeh-2 { width: 200px; height: 200px; top: 60%; right: 15%; animation-delay: 3s; }
        .bokeh-3 { width: 250px; height: 250px; bottom: 15%; left: 20%; animation-delay: 6s; }
        .bokeh-4 { width: 180px; height: 180px; top: 25%; right: 25%; animation-delay: 9s; }

        @keyframes bokehFloat {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            33% { transform: translate(50px, -40px) scale(1.3); opacity: 0.7; }
            66% { transform: translate(-30px, 30px) scale(0.9); opacity: 0.5; }
        }

        /* ============================================
           LIGHT RAYS — Cinematic God Rays
           ============================================ */
        .light-rays {
            position: absolute;
            inset: 0;
            background: conic-gradient(
                from 0deg at 50% 50%,
                transparent 0deg,
                rgba(201, 169, 97, 0.08) 20deg,
                transparent 40deg,
                rgba(201, 169, 97, 0.05) 60deg,
                transparent 80deg,
                rgba(201, 169, 97, 0.1) 100deg,
                transparent 120deg,
                rgba(201, 169, 97, 0.06) 140deg,
                transparent 160deg,
                rgba(201, 169, 97, 0.08) 180deg,
                transparent 200deg,
                rgba(201, 169, 97, 0.05) 220deg,
                transparent 240deg,
                rgba(201, 169, 97, 0.1) 260deg,
                transparent 280deg,
                rgba(201, 169, 97, 0.07) 300deg,
                transparent 320deg,
                rgba(201, 169, 97, 0.09) 340deg,
                transparent 360deg
            );
            animation: raysRotate 30s linear infinite;
            opacity: 0.7;
        }

        @keyframes raysRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ============================================
           PARTICLES
           ============================================ */
        .particles {
            position: absolute;
            inset: 0;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #c9a961;
            border-radius: 50%;
            box-shadow: 
                0 0 10px #c9a961,
                0 0 20px rgba(201, 169, 97, 0.6),
                0 0 30px rgba(201, 169, 97, 0.3);
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(-100px) scale(2) rotate(720deg);
                opacity: 0;
            }
        }

        /* ============================================
           MAIN CONTENT
           ============================================ */
        .content {
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 20px;
        }

        /* ============================================
           3D LOGO — Cinematic Rotation
           ============================================ */
        .logo-wrapper {
            perspective: 1000px;
            margin-bottom: 50px;
        }

        .logo-3d {
            width: 180px;
            height: 180px;
            margin: 0 auto;
            position: relative;
            transform-style: preserve-3d;
            animation: logo3dSpin 12s linear infinite;
        }

        @keyframes logo3dSpin {
            0% {
                transform: rotateY(0deg) rotateX(10deg) scale(1);
            }
            25% {
                transform: rotateY(90deg) rotateX(10deg) scale(1.05);
            }
            50% {
                transform: rotateY(180deg) rotateX(10deg) scale(1);
            }
            75% {
                transform: rotateY(270deg) rotateX(10deg) scale(1.05);
            }
            100% {
                transform: rotateY(360deg) rotateX(10deg) scale(1);
            }
        }

        .logo-circle {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #c9a961 0%, #e4c989 50%, #c9a961 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 60px rgba(201, 169, 97, 0.8),
                0 0 120px rgba(201, 169, 97, 0.4),
                inset 0 0 40px rgba(0, 0, 0, 0.3);
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                box-shadow: 
                    0 0 60px rgba(201, 169, 97, 0.8),
                    0 0 120px rgba(201, 169, 97, 0.4),
                    inset 0 0 40px rgba(0, 0, 0, 0.3);
            }
            50% {
                box-shadow: 
                    0 0 100px rgba(201, 169, 97, 1),
                    0 0 200px rgba(201, 169, 97, 0.6),
                    inset 0 0 60px rgba(0, 0, 0, 0.4);
            }
        }

        .logo-letter {
            font-family: 'Playfair Display', serif;
            font-size: 96px;
            font-weight: 900;
            color: #0a0a0a;
            letter-spacing: -5px;
            text-shadow: 
                0 0 30px rgba(0, 0, 0, 0.8),
                0 0 60px rgba(201, 169, 97, 0.5);
        }

        /* Ring Expansions */
        .ring {
            position: absolute;
            inset: -15px;
            border: 2px solid #c9a961;
            border-radius: 50%;
            opacity: 0;
            animation: ringExpand 3s infinite;
        }

        .ring-2 {
            inset: -30px;
            border-width: 1px;
            animation-delay: 1s;
        }

        .ring-3 {
            inset: -45px;
            border-width: 1px;
            animation-delay: 2s;
        }

        @keyframes ringExpand {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        /* ============================================
           BRAND NAME — Letter by Letter
           ============================================ */
        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            gap: 4px;
        }

        .brand-name .letter {
            color: #c9a961;
            text-shadow: 
                0 4px 30px rgba(201, 169, 97, 0.8),
                0 0 60px rgba(201, 169, 97, 0.4);
            opacity: 0;
            animation: letterReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes letterReveal {
            0% {
                opacity: 0;
                transform: translateY(60px) rotateX(-90deg) scale(0.5);
                filter: blur(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) rotateX(0) scale(1);
                filter: blur(0);
            }
        }

        /* ============================================
           TAGLINE
           ============================================ */
        .tagline {
            font-size: 13px;
            color: #888;
            letter-spacing: 8px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeSlideIn 1s ease 1.5s forwards;
        }

        .location {
            font-size: 11px;
            color: #666;
            letter-spacing: 3px;
            font-weight: 400;
            opacity: 0;
            animation: fadeSlideIn 1s ease 1.7s forwards;
        }

        @keyframes fadeSlideIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* ============================================
           GOLDEN DIVIDER
           ============================================ */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 30px 0;
            opacity: 0;
            animation: fadeSlideIn 1s ease 2s forwards;
        }

        .divider-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a961);
        }

        .divider-line.right {
            background: linear-gradient(90deg, #c9a961, transparent);
        }

        .divider-diamond {
            width: 8px;
            height: 8px;
            background: #c9a961;
            transform: rotate(45deg);
            box-shadow: 0 0 20px #c9a961;
            animation: diamondSpin 3s linear infinite;
        }

        @keyframes diamondSpin {
            from { transform: rotate(45deg) scale(1); }
            50% { transform: rotate(225deg) scale(1.3); }
            to { transform: rotate(405deg) scale(1); }
        }

        /* ============================================
           LOADING SECTION
           ============================================ */
        .loading-section {
            opacity: 0;
            animation: fadeSlideIn 1s ease 2.3s forwards;
        }

        .loading-text {
            font-size: 11px;
            color: #c9a961;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .loading-dots::after {
            content: '';
            animation: dotsAnimate 1.5s infinite;
        }

        @keyframes dotsAnimate {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        /* Progress Bar — Premium */
        .progress-bar {
            width: 280px;
            height: 3px;
            background: rgba(201, 169, 97, 0.15);
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #c9a961 0%, #e4c989 50%, #c9a961 100%);
            background-size: 200% 100%;
            border-radius: 10px;
            box-shadow: 
                0 0 20px rgba(201, 169, 97, 0.9),
                0 0 40px rgba(201, 169, 97, 0.5);
            animation: progressFill 3s ease-in-out forwards, shimmerEffect 1.5s linear infinite;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: -3px;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 
                0 0 20px #fff,
                0 0 40px #c9a961;
            animation: dotPulse 1s infinite;
        }

        @keyframes progressFill {
            0% { width: 0; }
            20% { width: 25%; }
            40% { width: 45%; }
            60% { width: 70%; }
            80% { width: 88%; }
            100% { width: 100%; }
        }

        @keyframes shimmerEffect {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
        }

        /* Percentage Counter */
        .percentage {
            font-size: 14px;
            color: #c9a961;
            letter-spacing: 2px;
            margin-top: 16px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(201, 169, 97, 0.6);
        }

        /* ============================================
           SPARKLES
           ============================================ */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #c9a961;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(0 0 10px #c9a961);
            pointer-events: none;
        }

        .sparkle-1 { top: 15%; left: 12%; animation: sparkleTwinkle 4s infinite; }
        .sparkle-2 { top: 22%; right: 15%; animation: sparkleTwinkle 4s infinite 0.5s; }
        .sparkle-3 { bottom: 20%; left: 18%; animation: sparkleTwinkle 4s infinite 1s; }
        .sparkle-4 { bottom: 15%; right: 20%; animation: sparkleTwinkle 4s infinite 1.5s; }
        .sparkle-5 { top: 45%; left: 8%; animation: sparkleTwinkle 4s infinite 2s; }
        .sparkle-6 { top: 55%; right: 8%; animation: sparkleTwinkle 4s infinite 2.5s; }
        .sparkle-7 { top: 30%; left: 25%; animation: sparkleTwinkle 4s infinite 3s; }
        .sparkle-8 { top: 70%; right: 25%; animation: sparkleTwinkle 4s infinite 3.5s; }

        @keyframes sparkleTwinkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.5) rotate(360deg);
            }
        }

        /* ============================================
           LOADING DOTS — Bottom
           ============================================ */
        .loading-dots-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            opacity: 0;
            animation: fadeSlideIn 1s ease 2.5s forwards;
        }

        .loading-dot {
            width: 10px;
            height: 10px;
            background: #c9a961;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(201, 169, 97, 0.9);
            animation: dotBounce 1.4s infinite ease-in-out;
        }

        .loading-dot:nth-child(1) { animation-delay: 0s; }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        .loading-dot:nth-child(4) { animation-delay: 0.6s; }
        .loading-dot:nth-child(5) { animation-delay: 0.8s; }

        @keyframes dotBounce {
            0%, 80%, 100% {
                transform: scale(0.5);
                opacity: 0.3;
            }
            40% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ============================================
           FOOTER
           ============================================ */
        .footer-text {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            color: #555;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeSlideIn 1s ease 2.8s forwards;
        }

        .footer-text .dot {
            color: #c9a961;
            margin: 0 8px;
        }

        /* ============================================
           SCREEN TRANSITION — Exit
           ============================================ */
        .splash.exit {
            animation: splashExit 0.8s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        }

        @keyframes splashExit {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.2); filter: blur(20px); }
        }

        /* ============================================
           MOBILE RESPONSIVE
           ============================================ */
        @media (max-width: 560px) {
            .logo-3d { width: 140px; height: 140px; }
            .logo-letter { font-size: 72px; }
            .brand-name { font-size: 38px; letter-spacing: 2px; }
            .tagline { font-size: 11px; letter-spacing: 5px; }
            .location { font-size: 10px; letter-spacing: 2px; }
            .progress-bar { width: 220px; }
            .bokeh-circle { filter: blur(30px); }
            .bokeh-1 { width: 200px; height: 200px; }
            .bokeh-2 { width: 150px; height: 150px; }
            .bokeh-3 { width: 180px; height: 180px; }
            .bokeh-4 { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

<div class="splash" id="splash">

    <!-- Bokeh Background -->
    <div class="bokeh">
        <div class="bokeh-circle bokeh-1"></div>
        <div class="bokeh-circle bokeh-2"></div>
        <div class="bokeh-circle bokeh-3"></div>
        <div class="bokeh-circle bokeh-4"></div>
    </div>

    <!-- Light Rays -->
    <div class="light-rays"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Sparkles -->
    <div class="sparkle sparkle-1"></div>
    <div class="sparkle sparkle-2"></div>
    <div class="sparkle sparkle-3"></div>
    <div class="sparkle sparkle-4"></div>
    <div class="sparkle sparkle-5"></div>
    <div class="sparkle sparkle-6"></div>
    <div class="sparkle sparkle-7"></div>
    <div class="sparkle sparkle-8"></div>

    <!-- Main Content -->
    <div class="content">

        <!-- 3D Logo -->
        <div class="logo-wrapper">
            <div class="logo-3d">
                <div class="logo-circle">
                    <div class="logo-letter">A</div>
                </div>
                <div class="ring"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
            </div>
        </div>

        <!-- Brand Name — Letter by Letter -->
        <h1 class="brand-name" id="brandName"></h1>

        <!-- Tagline -->
        <p class="tagline">Curated Thrift Fashion</p>
        <p class="location">Dhaka · Bangladesh · Est. 2024</p>

        <!-- Divider -->
        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-diamond"></div>
            <div class="divider-line right"></div>
        </div>

        <!-- Loading -->
        <div class="loading-section">
            <p class="loading-text">Loading<span class="loading-dots"></span></p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p class="percentage" id="percentage">0%</p>
        </div>

        <!-- Loading Dots -->
        <div class="loading-dots-row">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>

    </div>

    <!-- Footer -->
    <div class="footer-text">
        Premium <span class="dot">·</span> Curated <span class="dot">·</span> Timeless
    </div>

</div>

<script>
    // ============================================
    // Letter by Letter Brand Name
    // ============================================
    const brandName = document.getElementById('brandName');
    const brandText = 'ARTistico';

    brandText.split('').forEach((letter, index) => {
        const span = document.createElement('span');
        span.className = 'letter';
        span.textContent = letter;
        span.style.animationDelay = (0.3 + index * 0.1) + 's';
        brandName.appendChild(span);
    });

    // ============================================
    // Floating Particles
    // ============================================
    const particlesContainer = document.getElementById('particles');

    function createParticle() {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = (Math.random() * 4 + 5) + 's';
        particle.style.animationDelay = Math.random() * 3 + 's';
        particle.style.opacity = Math.random() * 0.7 + 0.3;
        particlesContainer.appendChild(particle);

        setTimeout(() => particle.remove(), 8000);
    }

    setInterval(createParticle, 150);
    for (let i = 0; i < 20; i++) {
        setTimeout(createParticle, i * 100);
    }

    // ============================================
    // Percentage Counter
    // ============================================
    const percentageEl = document.getElementById('percentage');
    let percentage = 0;

    const percentageInterval = setInterval(() => {
        percentage += Math.floor(Math.random() * 6) + 2;
        if (percentage >= 100) {
            percentage = 100;
            clearInterval(percentageInterval);
        }
        percentageEl.textContent = percentage + '%';
    }, 100);

    // ============================================
    // Redirect with Cinematic Exit
    // ============================================
    setTimeout(() => {
        const splash = document.getElementById('splash');
        splash.classList.add('exit');
        setTimeout(() => {
            window.location.href = '/';
        }, 800);
    }, 3500);

    // ============================================
    // Prevent scrolling
    // ============================================
    document.body.style.overflow = 'hidden';
</script>

</body>
</html>
