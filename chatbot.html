<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chatbot.css">
</head>
<body>
    <h1 style="font-family: 'DM Sans'; padding: 30px; color: #294d3b;">AI Chatbot Preview</h1>
    <p style="padding: 0 30px; color: #718078;">নিচে ডান দিকের সবুজ বাটনে ক্লিক করে টেস্ট করুন।</p>

    <button id="chatbotToggle" class="chatbot-toggle" aria-label="Open chat">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12zM7 9h10v2H7zm0-3h10v2H7z"/>
        </svg>
        <span class="chatbot-badge">1</span>
    </button>

    <div id="chatbotWindow" class="chatbot-window">
        <div class="chatbot-header">
            <div class="chatbot-header-info">
                <div class="chatbot-avatar">🤖</div>
                <div>
                    <h3>ARTistico Assistant</h3>
                    <p><span class="chatbot-status-dot"></span> অনলাইনে আছি</p>
                </div>
            </div>
            <button id="chatbotClose" class="chatbot-close" aria-label="Close">&times;</button>
        </div>

        <div id="chatbotMessages" class="chatbot-messages">
            <div class="chatbot-message bot">
                <div class="chatbot-message-avatar">🤖</div>
                <div class="chatbot-message-content">
                    <p>আসসালামু আলাইকুম! 👋</p>
                    <p>আমি ARTistico-র AI Assistant। আপনার যেকোনো প্রশ্ন জিজ্ঞেস করুন — যেমন:</p>
                    <ul>
                        <li>শার্টের দাম কত?</li>
                        <li>ডেলিভারি চার্জ কত?</li>
                        <li>সাইজ কীভাবে বুঝব?</li>
                    </ul>
                </div>
            </div>
        </div>

        <div id="chatbotTyping" class="chatbot-typing" style="display: none;">
            <div class="chatbot-message-avatar">🤖</div>
            <div class="chatbot-typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>

        <form id="chatbotForm" class="chatbot-input-form">
            <input id="chatbotInput" class="chatbot-input" type="text" placeholder="আপনার প্রশ্ন লিখুন..." autocomplete="off">
            <button type="submit" class="chatbot-send" aria-label="Send">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </form>
    </div>

    <script src="chatbot.js"></script>
</body>
</html>
